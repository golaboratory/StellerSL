services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stellersl
    ports:
      # Host port for external tools (psql etc.). Override when 5432 is taken
      # by another project: DB_PORT=15432 docker-compose up
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./_initdb:/docker-entrypoint-initdb.d

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    ports:
      - "8888:8888"
    environment:
      - DB_URL=postgres://user:password@db:5432/stellersl?sslmode=disable
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      # The Vite dev proxy must target the backend service, not the
      # frontend container's own localhost
      - VITE_BACKEND_URL=http://backend:8888
    depends_on:
      - backend

volumes:
  postgres_data:

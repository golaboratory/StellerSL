<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="darkbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>
    <radialGradient id="eyeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#darkbg)" stroke="#6366F1" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="18" fill="url(#eyeglow)"/>
  <!-- Eye shape -->
  <path d="M10 32 Q20 18 32 18 Q44 18 54 32 Q44 46 32 46 Q20 46 10 32Z" fill="#312E81" stroke="#818CF8" stroke-width="1.5"/>
  <!-- Eye iris -->
  <circle cx="32" cy="32" r="10" fill="#4F46E5"/>
  <circle cx="32" cy="32" r="10" fill="none" stroke="#A5B4FC" stroke-width="0.8"/>
  <!-- Crescent moon as pupil -->
  <circle cx="32" cy="32" r="6" fill="#1E1B4B"/>
  <circle cx="34" cy="30" r="6" fill="#4F46E5"/>
  <!-- Moon crescent highlight -->
  <circle cx="30" cy="30" r="2" fill="#C7D2FE" opacity="0.3"/>
  <!-- Small stars around the eye -->
  <circle cx="16" cy="22" r="1" fill="#C7D2FE" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="48" cy="22" r="0.8" fill="#A5B4FC" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="14" cy="38" r="0.6" fill="#C7D2FE" opacity="0.5"/>
  <circle cx="50" cy="38" r="0.7" fill="#A5B4FC" opacity="0.5"/>
  <!-- Subtle glow lines from eye -->
  <line x1="8" y1="32" x2="10" y2="32" stroke="#818CF8" stroke-width="0.8" opacity="0.4"/>
  <line x1="54" y1="32" x2="56" y2="32" stroke="#818CF8" stroke-width="0.8" opacity="0.4"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="darkbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>
    <radialGradient id="pageglow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C7D2FE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#darkbg)" stroke="#6366F1" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="20" fill="url(#pageglow)"/>
  <!-- Open book - left page -->
  <path d="M32 22 L32 48 Q24 44 14 46 L14 22 Q24 20 32 22Z" fill="#312E81" stroke="#A5B4FC" stroke-width="1.2"/>
  <!-- Open book - right page -->
  <path d="M32 22 L32 48 Q40 44 50 46 L50 22 Q40 20 32 22Z" fill="#312E81" stroke="#A5B4FC" stroke-width="1.2"/>
  <!-- Page lines (left) -->
  <line x1="18" y1="28" x2="29" y2="27" stroke="#818CF8" stroke-width="0.8" opacity="0.5"/>
  <line x1="18" y1="32" x2="29" y2="31" stroke="#818CF8" stroke-width="0.8" opacity="0.5"/>
  <line x1="18" y1="36" x2="29" y2="35" stroke="#818CF8" stroke-width="0.8" opacity="0.5"/>
  <line x1="18" y1="40" x2="29" y2="39.5" stroke="#818CF8" stroke-width="0.8" opacity="0.5"/>
  <!-- Page lines (right) -->
  <line x1="35" y1="27" x2="46" y2="28" stroke="#818CF8" stroke-width="0.8" opacity="0.5"/>
  <line x1="35" y1="31" x2="46" y2="32" stroke="#818CF8" stroke-width="0.8" opacity="0.5"/>
  <line x1="35" y1="35" x2="46" y2="36" stroke="#818CF8" stroke-width="0.8" opacity="0.5"/>
  <line x1="35" y1="39.5" x2="46" y2="40" stroke="#818CF8" stroke-width="0.8" opacity="0.5"/>
  <!-- Glow emanating from book -->
  <line x1="32" y1="18" x2="32" y2="14" stroke="#C7D2FE" stroke-width="1" opacity="0.6" stroke-linecap="round"/>
  <line x1="26" y1="18" x2="24" y2="14" stroke="#A5B4FC" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>
  <line x1="38" y1="18" x2="40" y2="14" stroke="#A5B4FC" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>
  <!-- Floating sparkles -->
  <circle cx="22" cy="14" r="1" fill="#C7D2FE" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="42" cy="12" r="1.2" fill="#A5B4FC" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.2;0.6" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>

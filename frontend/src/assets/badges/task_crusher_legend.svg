<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EDE9FE"/>
      <stop offset="40%" stop-color="#C4B5FD"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#6D28D9" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="23" fill="url(#inner)" opacity="0.9"/>
  <!-- Emanating rays -->
  <line x1="32" y1="8" x2="32" y2="14" stroke="#C4B5FD" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="32" y2="56" stroke="#C4B5FD" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8" y1="32" x2="14" y2="32" stroke="#C4B5FD" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="56" y2="32" stroke="#C4B5FD" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="15" y1="15" x2="19" y2="19" stroke="#C4B5FD" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="45" y1="45" x2="49" y2="49" stroke="#C4B5FD" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="49" y1="15" x2="45" y2="19" stroke="#C4B5FD" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="19" y1="45" x2="15" y2="49" stroke="#C4B5FD" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Diamond/gem shape -->
  <polygon points="32,14 46,30 32,50 18,30" fill="url(#gem)" stroke="#6D28D9" stroke-width="1" filter="url(#glow)"/>
  <!-- Gem facets -->
  <line x1="18" y1="30" x2="46" y2="30" stroke="#DDD6FE" stroke-width="0.8"/>
  <line x1="32" y1="14" x2="24" y2="30" stroke="#DDD6FE" stroke-width="0.5"/>
  <line x1="32" y1="14" x2="40" y2="30" stroke="#DDD6FE" stroke-width="0.5"/>
  <line x1="24" y1="30" x2="32" y2="50" stroke="#DDD6FE" stroke-width="0.5"/>
  <line x1="40" y1="30" x2="32" y2="50" stroke="#DDD6FE" stroke-width="0.5"/>
  <!-- Sparkle accents -->
  <circle cx="20" cy="18" r="1.2" fill="#EDE9FE"/>
  <circle cx="44" cy="18" r="1" fill="#EDE9FE"/>
  <circle cx="14" cy="42" r="0.8" fill="#EDE9FE"/>
  <circle cx="50" cy="42" r="0.8" fill="#EDE9FE"/>
</svg>
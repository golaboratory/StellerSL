<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="darkbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>
    <radialGradient id="peakglow" cx="50%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#C7D2FE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#darkbg)" stroke="#6366F1" stroke-width="2.5"/>
  <circle cx="32" cy="30" r="20" fill="url(#peakglow)"/>
  <!-- Mountain -->
  <polygon points="10,52 32,18 54,52" fill="#3730A3"/>
  <polygon points="10,52 32,18 54,52" fill="none" stroke="#818CF8" stroke-width="1"/>
  <!-- Snow cap -->
  <polygon points="26,28 32,18 38,28 35,26 32,28 29,26" fill="#A5B4FC" opacity="0.6"/>
  <!-- Second smaller mountain behind -->
  <polygon points="36,52 50,28 58,52" fill="#312E81" stroke="#6366F1" stroke-width="0.5"/>
  <!-- Flag on peak -->
  <line x1="32" y1="18" x2="32" y2="10" stroke="#C7D2FE" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M32 10 L42 13 L32 16Z" fill="#818CF8"/>
  <!-- Emanating rays from the flag -->
  <line x1="32" y1="6" x2="32" y2="8" stroke="#C7D2FE" stroke-width="1" opacity="0.7" stroke-linecap="round"/>
  <line x1="26" y1="8" x2="28" y2="10" stroke="#A5B4FC" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
  <line x1="38" y1="6" x2="37" y2="8" stroke="#A5B4FC" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
  <line x1="44" y1="9" x2="42" y2="11" stroke="#A5B4FC" stroke-width="0.8" opacity="0.5" stroke-linecap="round"/>
  <line x1="24" y1="6" x2="26" y2="8" stroke="#C7D2FE" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>
  <line x1="40" y1="5" x2="39" y2="7" stroke="#C7D2FE" stroke-width="0.8" opacity="0.4" stroke-linecap="round"/>
  <!-- "100" glow effect at base -->
  <circle cx="32" cy="44" r="8" fill="#4F46E5" opacity="0.3"/>
  <!-- Stylized 100 -->
  <rect x="22" y="40" width="2.5" height="8" rx="0.5" fill="#C7D2FE" opacity="0.8"/>
  <ellipse cx="30" cy="44" rx="3.5" ry="4" fill="none" stroke="#C7D2FE" stroke-width="1.8" opacity="0.8"/>
  <ellipse cx="39" cy="44" rx="3.5" ry="4" fill="none" stroke="#C7D2FE" stroke-width="1.8" opacity="0.8"/>
</svg>

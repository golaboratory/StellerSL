<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="eb-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <linearGradient id="eb-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <clipPath id="eb-clip">
      <circle cx="32" cy="32" r="28"/>
    </clipPath>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.3"/>
  <!-- Background -->
  <circle cx="32" cy="32" r="28" fill="url(#eb-bg)"/>
  <g clip-path="url(#eb-clip)">
    <!-- Sky gradient overlay -->
    <rect x="4" y="4" width="56" height="36" fill="#FDE68A" opacity="0.4"/>
    <!-- Horizon line -->
    <rect x="4" y="38" width="56" height="22" fill="#92400E" opacity="0.3"/>
    <!-- Sun -->
    <circle cx="32" cy="38" r="10" fill="url(#eb-sun)"/>
    <!-- Sun rays -->
    <g stroke="#FBBF24" stroke-width="1.5" stroke-linecap="round" opacity="0.8">
      <line x1="32" y1="24" x2="32" y2="20"/>
      <line x1="22" y1="28" x2="19" y2="25"/>
      <line x1="42" y1="28" x2="45" y2="25"/>
      <line x1="18" y1="35" x2="14" y2="35"/>
      <line x1="46" y1="35" x2="50" y2="35"/>
    </g>
    <!-- Horizon -->
    <line x1="4" y1="38" x2="60" y2="38" stroke="#92400E" stroke-width="1" opacity="0.5"/>
    <!-- Bird silhouette -->
    <path d="M20 28 Q23 24 26 27 Q29 24 32 28" fill="none" stroke="#7C2D12" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Small bird -->
    <path d="M40 25 Q42 22 44 24 Q46 22 48 25" fill="none" stroke="#7C2D12" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>

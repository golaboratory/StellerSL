<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="darkbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>
    <radialGradient id="centerglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C7D2FE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#darkbg)" stroke="#6366F1" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="20" fill="url(#centerglow)"/>
  <!-- Connecting ring -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#4F46E5" stroke-width="1" opacity="0.4"/>
  <!-- 7 dots arranged in a circle (representing 7 days) -->
  <!-- Top (Sun) -->
  <circle cx="32" cy="16" r="3.5" fill="#A5B4FC">
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <!-- Mon -->
  <circle cx="44.6" cy="20.6" r="3.5" fill="#818CF8">
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
  <!-- Tue -->
  <circle cx="48" cy="32" r="3.5" fill="#A5B4FC">
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <!-- Wed -->
  <circle cx="44.6" cy="43.4" r="3.5" fill="#818CF8">
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <!-- Thu -->
  <circle cx="32" cy="48" r="3.5" fill="#A5B4FC">
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" begin="1.6s" repeatCount="indefinite"/>
  </circle>
  <!-- Fri -->
  <circle cx="19.4" cy="43.4" r="3.5" fill="#818CF8">
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Sat -->
  <circle cx="16" cy="32" r="3.5" fill="#A5B4FC">
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- Center checkmark glow -->
  <circle cx="32" cy="32" r="6" fill="#6366F1" opacity="0.5"/>
  <polyline points="28,32 31,35 37,28" fill="none" stroke="#C7D2FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#BFDBFE"/>
    </linearGradient>
    <linearGradient id="gm-crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0.4"/>
  <!-- Background -->
  <circle cx="32" cy="32" r="28" fill="url(#gm-bg)"/>
  <!-- Network nodes and connections -->
  <!-- Central node -->
  <circle cx="32" cy="36" r="3.5" fill="#2563EB"/>
  <!-- Top-left node -->
  <line x1="32" y1="36" x2="18" y2="36" stroke="#3B82F6" stroke-width="1.2" opacity="0.6"/>
  <circle cx="18" cy="36" r="2.5" fill="#3B82F6"/>
  <!-- Top-right node -->
  <line x1="32" y1="36" x2="46" y2="36" stroke="#3B82F6" stroke-width="1.2" opacity="0.6"/>
  <circle cx="46" cy="36" r="2.5" fill="#3B82F6"/>
  <!-- Bottom-left node -->
  <line x1="32" y1="36" x2="22" y2="48" stroke="#3B82F6" stroke-width="1.2" opacity="0.6"/>
  <circle cx="22" cy="48" r="2.5" fill="#3B82F6"/>
  <!-- Bottom-right node -->
  <line x1="32" y1="36" x2="42" y2="48" stroke="#3B82F6" stroke-width="1.2" opacity="0.6"/>
  <circle cx="42" cy="48" r="2.5" fill="#3B82F6"/>
  <!-- Sub-nodes -->
  <line x1="18" y1="36" x2="10" y2="42" stroke="#93C5FD" stroke-width="0.8" opacity="0.4"/>
  <circle cx="10" cy="42" r="1.5" fill="#93C5FD"/>
  <line x1="46" y1="36" x2="54" y2="42" stroke="#93C5FD" stroke-width="0.8" opacity="0.4"/>
  <circle cx="54" cy="42" r="1.5" fill="#93C5FD"/>
  <line x1="18" y1="36" x2="12" y2="30" stroke="#93C5FD" stroke-width="0.8" opacity="0.4"/>
  <circle cx="12" cy="30" r="1.5" fill="#93C5FD"/>
  <line x1="46" y1="36" x2="52" y2="30" stroke="#93C5FD" stroke-width="0.8" opacity="0.4"/>
  <circle cx="52" cy="30" r="1.5" fill="#93C5FD"/>
  <!-- Crown on top -->
  <path d="M20 24 L24 14 L28 20 L32 10 L36 20 L40 14 L44 24Z" fill="url(#gm-crown)" stroke="#D97706" stroke-width="0.8"/>
  <!-- Crown base -->
  <rect x="20" y="24" width="24" height="4" rx="1" fill="url(#gm-crown)" stroke="#D97706" stroke-width="0.8"/>
  <!-- Crown jewels -->
  <circle cx="28" cy="25.5" r="1" fill="#EF4444"/>
  <circle cx="32" cy="25.5" r="1.2" fill="#3B82F6"/>
  <circle cx="36" cy="25.5" r="1" fill="#EF4444"/>
  <!-- Crown point gems -->
  <circle cx="32" cy="12" r="1" fill="#FBBF24"/>
  <circle cx="24" cy="16" r="0.8" fill="#FBBF24"/>
  <circle cx="40" cy="16" r="0.8" fill="#FBBF24"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="darkbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#darkbg)" stroke="#6366F1" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="22" fill="url(#glow)"/>
  <!-- Broom handle -->
  <line x1="26" y1="14" x2="34" y2="44" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Broom bristles -->
  <path d="M28 38 Q26 46 22 48 L30 44 Z" fill="#818CF8" opacity="0.8"/>
  <path d="M30 40 Q30 48 28 50 L34 45 Z" fill="#818CF8" opacity="0.8"/>
  <path d="M32 40 Q34 48 36 48 L36 44 Z" fill="#6366F1" opacity="0.7"/>
  <path d="M34 38 Q38 44 40 46 L37 42 Z" fill="#6366F1" opacity="0.6"/>
  <!-- Glowing sparkles -->
  <circle cx="18" cy="20" r="2" fill="#C7D2FE" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
  </circle>
  <line x1="18" y1="16" x2="18" y2="24" stroke="#C7D2FE" stroke-width="0.8" opacity="0.7"/>
  <line x1="14" y1="20" x2="22" y2="20" stroke="#C7D2FE" stroke-width="0.8" opacity="0.7"/>
  <circle cx="44" cy="22" r="1.5" fill="#A5B4FC" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <line x1="44" y1="19" x2="44" y2="25" stroke="#A5B4FC" stroke-width="0.6" opacity="0.6"/>
  <line x1="41" y1="22" x2="47" y2="22" stroke="#A5B4FC" stroke-width="0.6" opacity="0.6"/>
  <circle cx="42" cy="36" r="1" fill="#C7D2FE" opacity="0.6"/>
  <circle cx="16" cy="38" r="0.8" fill="#A5B4FC" opacity="0.5"/>
</svg>

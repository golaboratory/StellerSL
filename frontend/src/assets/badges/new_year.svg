<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F0FDFA"/>
      <stop offset="100%" stop-color="#CCFBF1"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="url(#accent)" stroke-width="2.5"/>
  <!-- Gift box body -->
  <rect x="18" y="30" width="28" height="18" rx="2" fill="#14B8A6"/>
  <!-- Gift box lid -->
  <rect x="16" y="26" width="32" height="6" rx="2" fill="#0D9488"/>
  <!-- Ribbon vertical -->
  <rect x="30" y="26" width="4" height="22" fill="#5EEAD4"/>
  <!-- Ribbon horizontal -->
  <rect x="16" y="27" width="32" height="4" fill="#5EEAD4" opacity="0.5"/>
  <!-- Bow -->
  <ellipse cx="29" cy="24" rx="4" ry="3" fill="#5EEAD4"/>
  <ellipse cx="35" cy="24" rx="4" ry="3" fill="#5EEAD4"/>
  <circle cx="32" cy="25" r="2" fill="#0D9488"/>
  <!-- Sparkles / firework bursts -->
  <circle cx="12" cy="14" r="1.5" fill="#14B8A6" opacity="0.8"/>
  <line x1="12" y1="10" x2="12" y2="18" stroke="#14B8A6" stroke-width="0.8" opacity="0.5"/>
  <line x1="8" y1="14" x2="16" y2="14" stroke="#14B8A6" stroke-width="0.8" opacity="0.5"/>
  <circle cx="50" cy="12" r="1.5" fill="#14B8A6" opacity="0.8"/>
  <line x1="50" y1="8" x2="50" y2="16" stroke="#14B8A6" stroke-width="0.8" opacity="0.5"/>
  <line x1="46" y1="12" x2="54" y2="12" stroke="#14B8A6" stroke-width="0.8" opacity="0.5"/>
  <!-- Small stars -->
  <polygon points="22,16 23,14 24,16 22.5,15 23.5,15" fill="#5EEAD4"/>
  <polygon points="42,18 43,16 44,18 42.5,17 43.5,17" fill="#5EEAD4"/>
</svg>

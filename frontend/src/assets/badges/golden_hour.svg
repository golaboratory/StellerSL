<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gh-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="gh-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.4"/>
  <!-- Background - sunset gradient -->
  <circle cx="32" cy="32" r="28" fill="url(#gh-bg)"/>
  <!-- Horizon glow -->
  <ellipse cx="32" cy="48" rx="24" ry="8" fill="#FBBF24" opacity="0.2"/>
  <!-- Clock face -->
  <circle cx="32" cy="30" r="14" fill="url(#gh-face)" opacity="0.9"/>
  <circle cx="32" cy="30" r="14" fill="none" stroke="#B45309" stroke-width="1.5"/>
  <!-- Tick marks -->
  <line x1="32" y1="18" x2="32" y2="20" stroke="#B45309" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="32" y1="40" x2="32" y2="42" stroke="#B45309" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="20" y1="30" x2="22" y2="30" stroke="#B45309" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="42" y1="30" x2="44" y2="30" stroke="#B45309" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Hour hand pointing to 5 -->
  <line x1="32" y1="30" x2="37" y2="39" stroke="#92400E" stroke-width="2" stroke-linecap="round"/>
  <!-- Minute hand pointing to 12 -->
  <line x1="32" y1="30" x2="32" y2="19" stroke="#B45309" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="32" cy="30" r="1.5" fill="#92400E"/>
  <!-- Sun setting below clock -->
  <circle cx="32" cy="52" r="6" fill="#FBBF24" opacity="0.6"/>
  <circle cx="32" cy="52" r="4" fill="#FDE68A" opacity="0.4"/>
</svg>

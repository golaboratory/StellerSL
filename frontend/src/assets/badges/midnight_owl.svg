<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
    <radialGradient id="mo-eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.5"/>
  <!-- Background -->
  <circle cx="32" cy="32" r="28" fill="url(#mo-bg)"/>
  <!-- Stars -->
  <circle cx="14" cy="14" r="1" fill="#FDE68A" opacity="0.8"/>
  <circle cx="50" cy="12" r="0.8" fill="#FDE68A" opacity="0.6"/>
  <circle cx="48" cy="22" r="0.6" fill="#FDE68A" opacity="0.5"/>
  <circle cx="12" cy="24" r="0.7" fill="#FDE68A" opacity="0.7"/>
  <!-- Crescent moon -->
  <path d="M46 10 A8 8 0 1 1 46 26 A6 6 0 1 0 46 10Z" fill="#FDE68A" opacity="0.9"/>
  <!-- Owl body -->
  <ellipse cx="32" cy="40" rx="14" ry="12" fill="#6B4423" opacity="0.8"/>
  <!-- Owl head -->
  <circle cx="32" cy="30" r="11" fill="#8B5E3C"/>
  <!-- Ear tufts -->
  <path d="M22 22 L25 27 L28 23Z" fill="#6B4423"/>
  <path d="M42 22 L39 27 L36 23Z" fill="#6B4423"/>
  <!-- Eye sockets -->
  <circle cx="27" cy="29" r="5.5" fill="#1E3A5F"/>
  <circle cx="37" cy="29" r="5.5" fill="#1E3A5F"/>
  <!-- Eyes -->
  <circle cx="27" cy="29" r="4" fill="url(#mo-eye)"/>
  <circle cx="37" cy="29" r="4" fill="url(#mo-eye)"/>
  <!-- Pupils -->
  <circle cx="27" cy="29" r="2" fill="#0F172A"/>
  <circle cx="37" cy="29" r="2" fill="#0F172A"/>
  <!-- Eye highlights -->
  <circle cx="28.5" cy="27.5" r="1" fill="white" opacity="0.8"/>
  <circle cx="38.5" cy="27.5" r="1" fill="white" opacity="0.8"/>
  <!-- Beak -->
  <path d="M30 33 L32 37 L34 33Z" fill="#F97316"/>
  <!-- Chest pattern -->
  <path d="M26 38 Q32 46 38 38 Q35 42 32 43 Q29 42 26 38Z" fill="#D4A574" opacity="0.6"/>
  <!-- Red accent ring glow -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.2"/>
</svg>

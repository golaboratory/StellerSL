<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="qs-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEE2E2"/>
      <stop offset="100%" stop-color="#FECACA"/>
    </linearGradient>
    <linearGradient id="qs-bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.4"/>
  <!-- Background -->
  <circle cx="32" cy="32" r="28" fill="url(#qs-bg)"/>
  <!-- Stopwatch body -->
  <circle cx="32" cy="35" r="14" fill="none" stroke="#DC2626" stroke-width="2.5"/>
  <circle cx="32" cy="35" r="12" fill="white" opacity="0.5"/>
  <!-- Stopwatch top button -->
  <rect x="30" y="18" width="4" height="4" rx="1" fill="#DC2626"/>
  <!-- Stopwatch crown -->
  <rect x="31" y="16" width="2" height="3" rx="0.5" fill="#DC2626"/>
  <!-- Side button -->
  <rect x="44" y="26" width="4" height="2" rx="0.5" fill="#B91C1C" transform="rotate(30 44 27)"/>
  <!-- Tick marks -->
  <line x1="32" y1="24" x2="32" y2="26" stroke="#DC2626" stroke-width="1" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="46" stroke="#DC2626" stroke-width="1" stroke-linecap="round"/>
  <line x1="20" y1="35" x2="22" y2="35" stroke="#DC2626" stroke-width="1" stroke-linecap="round"/>
  <line x1="42" y1="35" x2="44" y2="35" stroke="#DC2626" stroke-width="1" stroke-linecap="round"/>
  <!-- Lightning bolt through stopwatch -->
  <path d="M35 24 L29 35 L33 35 L28 48 L40 32 L35 32 L39 24Z" fill="url(#qs-bolt)" stroke="#B45309" stroke-width="0.5"/>
</svg>

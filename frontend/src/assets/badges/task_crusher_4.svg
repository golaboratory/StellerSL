  <!-- Gem accents on crown points -->
  <circle cx="32" cy="20" r="2.5" fill="#DDD6FE" stroke="#6D28D9" stroke-width="0.5"/>
  <circle cx="16" cy="26" r="2" fill="#EDE9FE"/>
  <circle cx="48" cy="26" r="2" fill="#EDE9FE"/>
  <!-- Three small gems on band -->
  <circle cx="26" cy="40.5" r="1.5" fill="#EDE9FE"/>
  <circle cx="32" cy="40.5" r="1.5" fill="#EDE9FE"/>
  <circle cx="38" cy="40.5" r="1.5" fill="#EDE9FE"/>

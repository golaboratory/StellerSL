<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ht-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FEE2E2"/>
      <stop offset="100%" stop-color="#FECACA"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.4"/>
  <!-- Background -->
  <circle cx="32" cy="32" r="28" fill="url(#ht-bg)"/>
  <!-- Motion arc -->
  <path d="M12 42 A24 24 0 0 1 52 42" fill="none" stroke="#EF4444" stroke-width="1" opacity="0.3" stroke-dasharray="3 2"/>
  <!-- Checkmark 1 (left, tilted) -->
  <g transform="translate(16, 28) rotate(-25)">
    <path d="M0 6 L4 10 L12 0" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Checkmark 2 (center, upright) -->
  <g transform="translate(24, 20)">
    <path d="M0 8 L5 14 L16 0" fill="none" stroke="#EF4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Checkmark 3 (right, tilted) -->
  <g transform="translate(38, 28) rotate(25)">
    <path d="M0 6 L4 10 L12 0" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Motion lines -->
  <line x1="14" y1="44" x2="18" y2="42" stroke="#EF4444" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="30" y1="46" x2="34" y2="46" stroke="#EF4444" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  <line x1="46" y1="44" x2="50" y2="42" stroke="#EF4444" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <!-- Speed swoosh -->
  <path d="M14 48 Q32 52 50 48" fill="none" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <!-- Number 3 accent -->
  <circle cx="32" cy="50" r="5" fill="#DC2626" opacity="0.15"/>
</svg>

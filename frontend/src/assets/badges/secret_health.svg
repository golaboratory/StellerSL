<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="darkbg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </radialGradient>
    <radialGradient id="heartglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#darkbg)" stroke="#6366F1" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="20" fill="url(#heartglow)"/>
  <!-- Heart shape -->
  <path d="M32 46 C22 38 12 30 12 22 C12 16 17 12 23 12 C27 12 30 15 32 18 C34 15 37 12 41 12 C47 12 52 16 52 22 C52 30 42 38 32 46Z" fill="#818CF8" opacity="0.8"/>
  <path d="M32 42 C24 36 16 29 16 23 C16 18 20 15 24 15 C27 15 30 17 32 20 C34 17 37 15 40 15 C44 15 48 18 48 23 C48 29 40 36 32 42Z" fill="#A5B4FC" opacity="0.6"/>
  <!-- Heartbeat/pulse line -->
  <polyline points="10,32 18,32 22,32 25,22 28,40 31,28 34,36 37,32 40,32 46,32 54,32" fill="none" stroke="#C7D2FE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </polyline>
</svg>

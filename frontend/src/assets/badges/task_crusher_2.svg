<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5F3FF"/>
      <stop offset="100%" stop-color="#DDD6FE"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#bg)" stroke="#6D28D9" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="23" fill="url(#inner)" opacity="0.9"/>
  <!-- Two overlapping stars with glow -->
  <polygon points="26,16 29.5,24 38,25 31.5,31 33,39.5 26,35 19,39.5 20.5,31 14,25 22.5,24" fill="#8B5CF6" opacity="0.7" filter="url(#glow)"/>
  <polygon points="38,18 41,25 48,26 43,31.5 44,39 38,35.5 32,39 33,31.5 28,26 35,25" fill="#8B5CF6" filter="url(#glow)"/>
</svg>